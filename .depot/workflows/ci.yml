# Migrated from .github/workflows/ci.yml.
# Changes:
# - runs-on: ubuntu-latest -> depot-ubuntu-latest

name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  check:
    # Remapped from ubuntu-latest. Depot CI runs its own runner labels.
    runs-on: depot-ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: condola
          POSTGRES_PASSWORD: condola
          POSTGRES_DB: condola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condola -d condola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://condola:condola@127.0.0.1:5432/condola
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install PDF raster tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Apply schema and seed
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/stub/supabase_stub.sql
          for migration in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          npm run db:reset
      - name: Check function execute privileges
        run: bash scripts/check-function-privileges.sh
      - run: npm run test:rls
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  acceptance:
    if: >
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'high-risk') ||
       contains(github.event.pull_request.labels.*.name, 'has-migration') ||
       contains(github.event.pull_request.labels.*.name, 'copy-change'))
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Label suites
        env:
          HIGH_RISK: ${{ contains(github.event.pull_request.labels.*.name, 'high-risk') }}
          HAS_MIGRATION: ${{ contains(github.event.pull_request.labels.*.name, 'has-migration') }}
          COPY_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'copy-change') }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          QA_ORG_A_JWT: ${{ secrets.QA_ORG_A_JWT }}
          QA_RPC_CASES_JSON: ${{ secrets.QA_RPC_CASES_JSON }}
          QA_RPC_SCHEMA: ${{ secrets.QA_RPC_SCHEMA }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
          QA_ADMIN_DISPLAY_NAME: ${{ secrets.QA_ADMIN_DISPLAY_NAME }}
          QA_ACCOUNTANT_EMAIL: ${{ secrets.QA_ACCOUNTANT_EMAIL }}
          QA_ACCOUNTANT_PASSWORD: ${{ secrets.QA_ACCOUNTANT_PASSWORD }}
          QA_MANAGER_EMAIL: ${{ secrets.QA_MANAGER_EMAIL }}
          QA_MANAGER_PASSWORD: ${{ secrets.QA_MANAGER_PASSWORD }}
          QA_OWNER_EMAIL: ${{ secrets.QA_OWNER_EMAIL }}
          QA_OWNER_PASSWORD: ${{ secrets.QA_OWNER_PASSWORD }}
          QA_TENANT_EMAIL: ${{ secrets.QA_TENANT_EMAIL }}
          QA_TENANT_PASSWORD: ${{ secrets.QA_TENANT_PASSWORD }}
          QA_READONLY_PAYMENT_PATH: ${{ secrets.QA_READONLY_PAYMENT_PATH }}
          QA_EXISTING_PAYMENT_PATH: ${{ secrets.QA_EXISTING_PAYMENT_PATH }}
          QA_STATEMENT_PATH: ${{ secrets.QA_STATEMENT_PATH }}
          QA_NEXT_STATEMENT_PATH: ${{ secrets.QA_NEXT_STATEMENT_PATH }}
          QA_NEGATIVE_STATEMENT_PATH: ${{ secrets.QA_NEGATIVE_STATEMENT_PATH }}
          QA_STATEMENT_PAYMENT_PATH: ${{ secrets.QA_STATEMENT_PAYMENT_PATH }}
          QA_OTHER_OWNER_STATEMENT_PATH: ${{ secrets.QA_OTHER_OWNER_STATEMENT_PATH }}
          QA_CROSS_ORG_STATEMENT_PATH: ${{ secrets.QA_CROSS_ORG_STATEMENT_PATH }}
          QA_MOVEOUT_PATH: ${{ secrets.QA_MOVEOUT_PATH }}
          QA_MOVEOUT_SHORTFALL_PATH: ${{ secrets.QA_MOVEOUT_SHORTFALL_PATH }}
          TRIAL_MODE: ${{ secrets.TRIAL_MODE }}
        run: bash scripts/acceptance-label.sh

  # Staging Worker only. This job never deploys production.
  # It runs after `check` succeeds, and only on a push to main, when the
  # repository variable STAGING_AUTODEPLOY is exactly "true". Unset, empty,
  # or any other value skips the job (the default is off).
  # CLOUDFLARE_API_TOKEN is required; the job fails before deploy when it is missing.
  deploy-staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_AUTODEPLOY == 'true'
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require the Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is required to deploy staging." >&2
            exit 1
          fi
      - name: Build the OpenNext bundle
        run: |
          if [[ -n "${DATABASE_URL:-}" || -n "${SUPABASE_URL:-}" || -n "${SUPABASE_ANON_KEY:-}" || -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || -n "${ID_DOC_ENCRYPTION_KEY:-}" || -n "${ID_DOC_HMAC_KEY:-}" || -n "${ID_DOC_SIGNING_SECRET:-}" || -n "${CRON_SECRET:-}" || -n "${CLOUDFLARE_API_TOKEN:-}" || "${DEMO_MODE:-}" == "true" ]]; then
            echo "Refusing to build with database secrets, ID document keys, the Cloudflare token, or DEMO_MODE=true in the environment." >&2
            exit 1
          fi
          npm run cf:build
      - name: Apply staging migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "DATABASE_URL is required to apply staging migrations. Use the Tokyo session connection (port 5432). The value is not printed." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash scripts/db-migrate.sh
      - name: Deploy the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cf-deploy-staging.sh
