# Minimal config so `supabase start` (Docker) can boot this project.
# Apply supabase/migrations only. Do not apply supabase/stub on Supabase.
project_id = "condola"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:43123"

[storage]
enabled = true
file_size_limit = "50MiB"
