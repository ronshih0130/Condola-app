name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  # Fails unless this commit already contains the latest origin/main.
  # pull_request checkouts are merge commits, so this job checks the PR head.
  rebase:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require rebase onto latest main
        run: |
          git fetch origin main --no-tags
          node scripts/ci/rebase-check.mjs

  banned-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print banned_terms.md sha256
        run: sha256sum config/banned_terms.md
      - name: Banned words in user-facing copy
        run: npm run copy:check

  # scripts/check-function-privileges.sh lands with PR #45. Until that file is
  # on the branch, this job records the skip and passes. After it merges, the
  # same job runs the script against a scratch database.
  privileges:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: condola
          POSTGRES_PASSWORD: condola
          POSTGRES_DB: condola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condola -d condola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://condola:condola@127.0.0.1:5432/condola
    steps:
      - uses: actions/checkout@v4
      - name: Function privilege gate
        run: |
          if [[ -f scripts/check-function-privileges.sh ]]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
            bash scripts/check-function-privileges.sh
          else
            echo "NOTE: scripts/check-function-privileges.sh is not on this branch."
            echo "PR #45 (https://cursor.com/codebase/ron-shih/condola-app/pull/45) adds it."
            echo "This job is already wired. It will run the script on the first commit that contains the file, and it skips until then."
          fi

  # New functions in the pull request diff must revoke EXECUTE from PUBLIC, anon,
  # and authenticated unless supabase/rpc-allowlist.txt lists the signature.
  function-revokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: New functions revoke EXECUTE from PUBLIC, anon, and authenticated
        run: |
          git fetch origin main --no-tags
          node scripts/ci/function-revokes.mjs --table permissions-table.md
          test -s permissions-table.md

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: condola
          POSTGRES_PASSWORD: condola
          POSTGRES_DB: condola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condola -d condola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://condola:condola@127.0.0.1:5432/condola
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install PDF raster tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Fresh database with every migration
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/stub/supabase_stub.sql
          for migration in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          npm run db:reset
      - run: npm run test:rls
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
