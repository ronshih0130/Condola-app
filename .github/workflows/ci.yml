name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Site-only changes are covered by site.yml (test + build + secret-scan).
    # Mixed PRs that also touch app paths still run this workflow.
    paths-ignore:
      - "site/**"
  push:
    branches:
      - "**"
    paths-ignore:
      - "site/**"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: condola
          POSTGRES_PASSWORD: condola
          POSTGRES_DB: condola
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condola -d condola"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://condola:condola@127.0.0.1:5432/condola
      DEMO_MODE: "true"
      CONDOLA_RLS_DISPOSABLE: "YES"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Generate ephemeral synthetic test material
        # This check job owns disposable fixture data. No maintenance/prod keys.
        # GITHUB_ENV is an ephemeral runner file outside the checkout; print no values.
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { randomBytes } = require('node:crypto');
          if (!process.env.GITHUB_ENV || process.env.CONDOLA_RLS_DISPOSABLE !== 'YES') throw new Error('Disposable CI environment required');
          const names = ['ID_DOC_ENCRYPTION_KEY', 'ID_DOC_HMAC_KEY', 'ID_DOC_SIGNING_SECRET'];
          fs.appendFileSync(process.env.GITHUB_ENV, names.map(name => name + '=' + randomBytes(32).toString('hex')).join('\n') + '\n');
          fs.chmodSync(process.env.GITHUB_ENV, 0o600);
          NODE
      - run: npm ci
      - name: Install PDF raster tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run copy:check
      - run: npm run test:unit
      - name: Apply schema and seed
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/stub/supabase_stub.sql
          for migration in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          npm run db:reset
      - name: Check function execute privileges
        run: bash scripts/check-function-privileges.sh
      - run: npm run test:rls
      - run: npm run cf:build
      - run: npm run test:worker
      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e')) }}
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e')) }}
        run: npm run test:e2e
